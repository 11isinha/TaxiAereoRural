
name: Gerar APK Android - TaxiAereoRural

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar aplicativo Android
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Baixar código do GitHub
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Instalar dependências
        run: npm ci

      - name: Gerar arquivos React
        run: npm run build

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Dar permissão ao Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK
        run: |
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: TaxiAereoRural-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
